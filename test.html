  <script>
    // Obtener los datos del usuario desde localStorage
    const jerarquia = localStorage.getItem("jerarquiaUsuario");
    const nombreUsuario = localStorage.getItem("nombreUsuario");

    // Redirigir al login si no hay sesión activa
    if (!jerarquia) {
      window.location.href = "index.html";
    } else {
      console.log("Usuario autenticado:", nombreUsuario, "| Jerarquía:", jerarquia);
      const usuarioSpan = document.getElementById("info-usuario");
      const jerarquiaSpan = document.getElementById("info-jerarquia");
      if (usuarioSpan) usuarioSpan.textContent = nombreUsuario;
      if (jerarquiaSpan) jerarquiaSpan.textContent = jerarquia === "1" ? "Administrador" : "Obrero";
    }

    document.getElementById("btn-ver-perfil").addEventListener("click", () => {
      const perfilDiv = document.getElementById("perfil-info");
      if (perfilDiv.style.display === "none") {
        perfilDiv.style.display = "block";
      } else {
        perfilDiv.style.display = "none";
      }
    });
  </script>

    const secciones = {

<h2 class="text-2xl font-bold mb-4 text-center">Fichas Técnicas de Pantalones</h2>

`,
      logistica: `

    <div class="mt-4 text-sm">
      <strong>Total: <span class="text-teal-600">$255</span></strong> <span class="text-gray-500">(Cálculo automático: Cantidad × Precio Unitario)</span>

    <div class="mt-4 flex flex-wrap gap-3">

    <h3 class="text-lg font-semibold mb-2">Pedidos</h3>
    <div class="flex justify-between items-center mb-2">
      <input type="search" class="border p-2 rounded text-sm" placeholder="Search" />
      <button class="bg-teal-600 text-white px-4 py-1 rounded text-sm">+ Agregar.</button>
    </div>

    <table class="w-full text-sm border">

      </thead>
      <tbody>
        <tr class="border-t"><td class="p-2 border">1</td><td class="p-2 border">Jorge Morales</td><td class="p-2 border">Pantalon de Vestir</td><td class="p-2 border">1200</td></tr>
        <tr class="border-t"><td class="p-2 border">3635</td><td class="p-2 border">Claudia Sheinbaun</td><td class="p-2 border">Pantalon de Mezclilla</td><td class="p-2 border">400</td></tr>
        <tr class="border-t"><td class="p-2 border">6468</td><td class="p-2 border">Andres Lopez</td><td class="p-2 border">Pantalon de Vestir</td><td class="p-2 border">500</td></tr>
        <tr class="border-t"><td class="p-2 border">3580</td><td class="p-2 border">Carlos Salinas</td><td class="p-2 border">Jeans</td><td class="p-2 border">999</td></tr>
        <tr class="border-t"><td class="p-2 border">33312</td><td class="p-2 border">Carlos Salinas</td><td class="p-2 border">Jeans</td><td class="p-2 border">888</td></tr>
        <!-- Más filas... -->
      </tbody>
    </table>

    <h3 class="text-lg font-semibold mb-2 mt-8">Inventario</h3>
    <div class="flex justify-between items-center mb-2">
      <input type="search" class="border p-2 rounded text-sm" placeholder="Search" />
      <button class="bg-teal-600 text-white px-4 py-1 rounded text-sm">+ Agregar.</button>
    </div>

    <table class="w-full text-sm border">
      <thead class="bg-gray-100 text-left">
        <tr>
          <th class="p-2 border">ID</th>
          <th class="p-2 border">MATERIAL</th>
          <th class="p-2 border">CANTIDAD_DISPONIBLE</th>
          <th class="p-2 border">CANTIDAD_MINIMA</th>
          <th class="p-2 border">ESTADO</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-t"><td class="p-2 border">1</td><td class="p-2 border">Tela de algodón</td><td class="p-2 border">500</td><td class="p-2 border">100</td><td class="p-2 border">Disponible</td></tr>
        <tr class="border-t"><td class="p-2 border">2</td><td class="p-2 border">Hilo negro</td><td class="p-2 border">0</td><td class="p-2 border">50</td><td class="p-2 border">No disponible</td></tr>
        <tr class="border-t"><td class="p-2 border">3</td><td class="p-2 border">Botones</td><td class="p-2 border">1000</td><td class="p-2 border">200</td><td class="p-2 border">Disponible</td></tr>
        <tr class="border-t"><td class="p-2 border">4</td><td class="p-2 border">Cremalleras</td><td class="p-2 border">300</td><td class="p-2 border">100</td><td class="p-2 border">Disponible</td></tr>
        <tr class="border-t"><td class="p-2 border">5</td><td class="p-2 border">Forro de tela</td><td class="p-2 border">400</td><td class="p-2 border">150</td><td class="p-2 border">Disponible</td></tr>
      </tbody>
    </table>
    <div class="mt-4 flex flex-wrap gap-3">
      <button onclick="mostrarFormularioInventario('agregar')" class="bg-green-600 text-white px-4 py-2 rounded text-sm">Agregar Material</button>
      <button onclick="mostrarFormularioInventario('editar')" class="bg-yellow-500 text-white px-4 py-2 rounded text-sm">Editar Material</button>
      <button onclick="mostrarFormularioInventario('eliminar')" class="bg-red-600 text-white px-4 py-2 rounded text-sm">Eliminar Material</button>
    </div>
  </div>
`};

    // Variable global para la instancia de la gráfica de pedidos
    let graficaPedidosInstance = null;

    function inicializarGraficas() {
        const canvasPedidos = document.getElementById("graficaPedidos");
        if (canvasPedidos) {
            const ctxPedidos = canvasPedidos.getContext('2d');
            if (graficaPedidosInstance) {
                graficaPedidosInstance.destroy();
            }
            graficaPedidosInstance = new Chart(ctxPedidos, {
                type: 'doughnut',
                data: {
                    labels: ["En proceso", "Completado", "Pendiente"],
                    datasets: [{
                        label: "Pedidos",
                        data: [14, 5, 5],
                        backgroundColor: ["#0d9488", "#b45309", "#a855f7"],
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: "bottom"
                        }
                    }
                }
            });
        }
    }

    function mostrarSeccion(nombre) {
      content.innerHTML = secciones[nombre];

      // Colorear el botón activo
      for (const key in botones) {
        botones[key].classList.remove("text-teal-600", "font-semibold");
        botones[key].classList.add("text-gray-500");
      }
      botones[nombre].classList.remove("text-gray-500");
      botones[nombre].classList.add("text-teal-600", "font-semibold");

      // FICHAS DINÁMICAS
      if (nombre === "fichas") {
        // Mensaje de consola para depuración
        console.log("Cargando fichas técnicas...");
        // Insertar botón + Nueva Ficha antes del contenedor de las fichas
        const fichasHeader = document.querySelector("#content h2.text-2xl");
        if (fichasHeader) {
          const btnDiv = document.createElement("div");
          btnDiv.className = "flex justify-end mb-4";
          btnDiv.innerHTML = `<button onclick="mostrarFormularioFicha()" class="bg-teal-600 text-white px-4 py-2 rounded text-sm">+ Nueva Ficha</button>`;
          fichasHeader.insertAdjacentElement("afterend", btnDiv);
        }
        // Cargar fichas técnicas desde la base de datos vía API
        fetch("api/fichas/get_fichas.php")
          .then(res => res.json())
          .then(data => {
            console.log("Datos recibidos para fichas:", data);  // Línea añadida
            const container = document.getElementById("fichas-container");
            if (Array.isArray(data)) {
              container.innerHTML = "";
              data.forEach(ficha => {
                console.log("Ficha individual:", ficha);
                const card = document.createElement("div");
                card.className = "bg-white shadow rounded overflow-hidden";
                card.innerHTML = `
                  <img src="img/${ficha.sku ? ficha.sku : 'placeholder'}.jpg" alt="${ficha.nombre}" class="w-full h-48 object-cover">
                  <div class="p-4">
                    <h3 class="text-lg font-semibold">${ficha.nombre}</h3>
                    <p class="text-sm text-gray-600 mt-2">${ficha.descripcion}</p>
                    <div class="mt-2 text-sm text-gray-700">
                      <p><strong>Botones:</strong> ${ficha.boton}</p>
                      <p><strong>Cierres:</strong> ${ficha.cierre}</p>
                      <p><strong>Hilos:</strong> ${ficha.hilo}</p>
                    </div>
                  </div>
                `;
                container.appendChild(card);
              });
            } else {
              // Si la respuesta no es un array, mostrar error claro
              container.innerHTML = `<p class="text-center text-red-500">Error: Respuesta inesperada al cargar fichas técnicas.</p>`;
              console.error("La respuesta de get_fichas.php no es un array:", data);
            }
          })
          .catch(err => {
            console.error("Error cargando fichas:", err);
            const container = document.getElementById("fichas-container");
            container.innerHTML = `<p class="text-center text-red-500">Error loading fichas.</p>`;
          });
      }

// Llamar cuando se muestra la sección resumen
const originalMostrarSeccion = mostrarSeccion;
mostrarSeccion = function(nombre) {
  originalMostrarSeccion(nombre);
    if (nombre === "asignacion") {
      fetch("api/tareas/get_operadores.php")
        .then(res => res.json())
      .then(data => {
        if (Array.isArray(data)) {

          const asignacionDiv = document.getElementById("contenedor-operadores");
          if (asignacionDiv) {
            asignacionDiv.innerHTML = ""; // limpiar contenido anterior
            data.forEach(op => {
              const div = document.createElement("div");
              div.className = "p-3 bg-gray-100 rounded";
              div.innerHTML = `
  <div class="flex justify-between items-center">
    <div>
      <span class="text-teal-600 font-bold text-sm">${op.especialidad}</span><br>
      ${op.nombre} - ${op.tarea_asignada}
    </div>
    <div>
      <button 
        onclick="asignarTarea(${op.id}, '${op.nombre}')"
        class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-3 py-1 rounded"
      >
        Editar tarea
      </button>
      ${jerarquia !== "2" ? `
        <button 
          onclick="gestionarOperador(${op.id}, '${op.nombre}', '${op.especialidad}')"
          class="bg-yellow-500 hover:bg-yellow-600 text-white text-xs px-3 py-1 rounded ml-2"
        >
          Opciones
        </button>
      ` : ""}
    </div>
  </div>
`;
              asignacionDiv.appendChild(div);
            });
          }
          const disponiblesDiv = document.getElementById("contenedor-disponibles");
          if (disponiblesDiv) {
            disponiblesDiv.innerHTML = "";
            data.forEach(op => {
              const div = document.createElement("div");
              div.innerHTML = `<span class="text-teal-600 font-bold">${op.especialidad.toUpperCase()}</span><br>${op.nombre}`;
              disponiblesDiv.appendChild(div);
            });
          }
        }
      })
      .catch(err => console.error("Error cargando operadores:", err));
  }
  if (nombre === "resumen") {
    setTimeout(inicializarGraficas, 100); // dar tiempo a que se renderice el DOM

    // Cargar datos de inventario y actualizar la gráfica de disponibilidad
    fetch("api/inventario/get_inventario.php")
        .then(res => res.json())
        .then(data => {
            let inventarioArray = [];
            if (Array.isArray(data)) {
                inventarioArray = data;
            } else if (data.success && Array.isArray(data.data)) {
                inventarioArray = data.data;
            }
            const nombres = inventarioArray.map(item => item.Material);
            const cantidades = inventarioArray.map(item => parseInt(item.cantidad_disp, 10));

            const canvasDisponibilidad = document.getElementById("graficaDisponibilidad");
            if (canvasDisponibilidad) {
                const ctx = canvasDisponibilidad.getContext('2d');
                if (window.graficaDisponibilidadInstance) {
                    window.graficaDisponibilidadInstance.destroy();
                }
                window.graficaDisponibilidadInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: nombres,
                        datasets: [{
                            label: 'Cantidad disponible',
                            data: cantidades,
                            backgroundColor: '#0d9488'
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }
        })
        .catch(err => {
            console.error("Error cargando la gráfica de disponibilidad:", err);
        });
  }

  // --- Cargar inventario dinámicamente al mostrar logística ---
  if (nombre === "logistica") {
    fetch("api/inventario/get_inventario.php")
      .then(res => {
        if (!res.ok) {
          throw new Error("Error al conectar con la API de inventario");
        }
        return res.json();
      })
      .then(data => {
        console.log("Datos de inventario recibidos:", data);
        const tablas = document.querySelectorAll("table");
        if (tablas.length >= 2) {  // La segunda tabla es la de inventario
          const tbody = tablas[1].querySelector("tbody");
          if (tbody) {
            tbody.innerHTML = ""; // Limpiar contenido anterior
            let inventarioArray = [];
            if (Array.isArray(data)) {
              inventarioArray = data;
              data.forEach(item => {
                const tr = document.createElement("tr");
                tr.className = "border-t";
                tr.innerHTML = `
                  <td class="p-2 border">${item.id}</td>
                  <td class="p-2 border">${item.Material}</td>
                  <td class="p-2 border">${item.cantidad_disp}</td>
                  <td class="p-2 border">${item.cantidad_min}</td>
                  <td class="p-2 border">${item.estado}</td>
                `;
                tbody.appendChild(tr);
              });
            } else if (data.success && Array.isArray(data.data)) {
              inventarioArray = data.data;
              data.data.forEach(item => {
                const tr = document.createElement("tr");
                tr.className = "border-t";
                tr.innerHTML = `
                  <td class="p-2 border">${item.id}</td>
                  <td class="p-2 border">${item.Material}</td>
                  <td class="p-2 border">${item.cantidad_disp}</td>
                  <td class="p-2 border">${item.cantidad_min}</td>
                  <td class="p-2 border">${item.estado}</td>
                `;
                tbody.appendChild(tr);
              });
            } else {
              const tr = document.createElement("tr");
              tr.innerHTML = `<td colspan="5" class="p-2 border text-center text-red-500">No data available or invalid format.</td>`;
              tbody.appendChild(tr);
            }
            // --- Ya no actualizar la gráfica de disponibilidad aquí ---
          }
        }
      })
      .catch(err => {
        console.error("Error al cargar inventario:", err);
        const tablas = document.querySelectorAll("table");
        if (tablas.length >= 2) {
          const tbody = tablas[1].querySelector("tbody");
          if (tbody) {
            tbody.innerHTML = `<tr><td colspan="5" class="p-2 border text-center text-red-500">Error loading inventory data.</td></tr>`;
          }
        }
      });
  }

  if (nombre !== "logistica") {
    const logisticaDiv = document.getElementById("logistica-screen");
    if (logisticaDiv) {
      logisticaDiv.style.display = "none";
    }
  }
};
    }

    // Mostrar por defecto
    // Mostrar u ocultar botones del menú según jerarquía
    
    // Mostrar sección inicial según jerarquía
    mostrarSeccion(jerarquia === "2" ? "asignacion" : "resumen");

    // Forzar carga inmediata de la gráfica de disponibilidad si arrancamos en "resumen"
    if (jerarquia !== "2") {
        fetch("api/inventario/get_inventario.php")
            .then(res => res.json())
            .then(data => {
                let inventarioArray = [];
                if (Array.isArray(data)) {
                    inventarioArray = data;
                } else if (data.success && Array.isArray(data.data)) {
                    inventarioArray = data.data;
                }
                const nombres = inventarioArray.map(item => item.Material);
                const cantidades = inventarioArray.map(item => parseInt(item.cantidad_disp, 10));

                const canvasDisponibilidad = document.getElementById("graficaDisponibilidad");
                if (canvasDisponibilidad) {
                    const ctx = canvasDisponibilidad.getContext('2d');
                    if (window.graficaDisponibilidadInstance) {
                        window.graficaDisponibilidadInstance.destroy();
                    }
                    window.graficaDisponibilidadInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: nombres,
                            datasets: [{
                                label: 'Cantidad disponible',
                                data: cantidades,
                                backgroundColor: '#0d9488'
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                }
            })
            .catch(err => {
                console.error("Error cargando la gráfica inicial de disponibilidad:", err);
            });
    }
    
    function asignarTarea(id, nombre) {
      fetch("api/tareas/get_tareas.php")
        .then(response => response.json())
        .then(tareas => {
          console.log("Tareas recibidas:", tareas);
          const select = document.createElement("select");
          select.className = "border p-2 rounded w-full mt-2";
          tareas.forEach(t => {
            console.log("Tarea recibida:", t);  // Debug para ver qué campos llegan
            // Validar nombre y descripción como cadenas válidas
            const nombreTarea = (t.nombre && typeof t.nombre === "string") ? t.nombre : "(Nombre no disponible)";
            const descripcionTarea = (t.descripcion && typeof t.descripcion === "string") ? t.descripcion : "(Descripción no disponible)";
            const option = document.createElement("option");
            option.value = t.id;
            option.textContent = `${nombreTarea} - ${descripcionTarea}`;
            select.appendChild(option);
          });

          const modal = document.createElement("div");
          modal.className = "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50";

          const modalContent = document.createElement("div");
          modalContent.className = "bg-white p-6 rounded shadow-md w-80";

          const heading = document.createElement("h2");
          heading.className = "text-lg font-semibold mb-2";
          heading.textContent = `Asignar nueva tarea a ${nombre}`;

          const btns = document.createElement("div");
          btns.className = "mt-4 flex justify-end space-x-2";

          const btnCancelar = document.createElement("button");
          btnCancelar.textContent = "Cancelar";
          btnCancelar.className = "bg-gray-300 hover:bg-gray-400 text-sm px-3 py-1 rounded";
          btnCancelar.id = "cancelar";

          const btnGuardar = document.createElement("button");
          btnGuardar.textContent = "Guardar";
          btnGuardar.className = "bg-teal-600 text-white hover:bg-teal-700 text-sm px-3 py-1 rounded";
          btnGuardar.id = "guardar";

          btns.appendChild(btnCancelar);
          btns.appendChild(btnGuardar);

          modalContent.appendChild(heading);
          modalContent.appendChild(select);
          modalContent.appendChild(btns);
          modal.appendChild(modalContent);
          document.body.appendChild(modal);

          document.getElementById("cancelar").onclick = () => document.body.removeChild(modal);
          document.getElementById("guardar").onclick = () => {
            const nuevaTarea = select.value;
            fetch(`api/tareas/update_tarea_operador.php?jerarquia=${jerarquia}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id, tarea_asignada: nuevaTarea })
            })
              .then(res => res.json())
              .then(data => {
                console.log("Respuesta del servidor al actualizar tarea:", data);
                const notif = document.getElementById("notificacion");
                if (data.success) {
                  notif.textContent = "Tarea actualizada correctamente";
                  mostrarSeccion("asignacion");
                } else {
                  notif.textContent = "Error al actualizar tarea";
                }
                notif.classList.remove("hidden");
                setTimeout(() => notif.classList.add("hidden"), 3000);
              })
              .catch(err => {
                console.error("Error al enviar actualización:", err);
                alert("No se pudo actualizar la tarea.");
              });
            document.body.removeChild(modal);
          };
        })
        .catch(err => {
          console.error("Error al cargar lista de tareas:", err);
          alert("No se pudo cargar la lista de tareas.");
        });
    }

    function gestionarOperador(id, nombre, especialidad) {
      const modal = document.createElement("div");
      modal.className = "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50";

      const modalContent = document.createElement("div");
      modalContent.className = "bg-white p-6 rounded shadow-md w-80";

      const title = document.createElement("h2");
      title.className = "text-lg font-semibold mb-2";
      title.textContent = `Gestionar operador: ${nombre}`;

      const nombreInput = document.createElement("input");
      nombreInput.value = nombre;
      nombreInput.placeholder = "Nombre";
      nombreInput.className = "w-full border p-2 mb-2 text-sm rounded";

      const especialidadInput = document.createElement("input");
      especialidadInput.value = especialidad;
      especialidadInput.placeholder = "Especialidad";
      especialidadInput.className = "w-full border p-2 mb-2 text-sm rounded";

      const btns = document.createElement("div");
      btns.className = "flex justify-between mt-4";

      const btnActualizar = document.createElement("button");
      btnActualizar.textContent = "Actualizar";
      btnActualizar.className = "bg-blue-500 text-white px-3 py-1 rounded text-sm";

      const btnEliminar = document.createElement("button");
      btnEliminar.textContent = "Eliminar";
      btnEliminar.className = "bg-red-500 text-white px-3 py-1 rounded text-sm";

      const btnCancelar = document.createElement("button");
      btnCancelar.textContent = "Cancelar";
      btnCancelar.className = "bg-gray-300 px-3 py-1 rounded text-sm";

      btns.appendChild(btnActualizar);
      btns.appendChild(btnEliminar);
      btns.appendChild(btnCancelar);

      modalContent.appendChild(title);
      modalContent.appendChild(nombreInput);
      modalContent.appendChild(especialidadInput);
      modalContent.appendChild(btns);
      modal.appendChild(modalContent);
      document.body.appendChild(modal);

      btnCancelar.onclick = () => document.body.removeChild(modal);

      btnActualizar.onclick = () => {
        const idValido = parseInt(id);
        if (!nombreInput.value.trim() || !especialidadInput.value.trim() || isNaN(idValido)) {
          alert("Datos inválidos.");
          return;
        }

        console.log("Enviando actualización:", {
          accion: "actualizar",
          id: idValido,
          nombre: nombreInput.value,
          especialidad: especialidadInput.value
        });

        fetch("api/tareas/update_operador.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            accion: "actualizar",
            id: idValido,
            nombre: nombreInput.value,
            especialidad: especialidadInput.value
          })
        })
        .then(async res => {
          const texto = await res.text();
          console.log("Respuesta cruda del servidor:", texto);
          try {
            const data = JSON.parse(texto);
            if (data.success) {
              alert("Operador actualizado");
              mostrarSeccion("asignacion");
            } else {
              alert("Error: " + data.error);
            }
          } catch (err) {
            console.error("Error al parsear JSON:", err);
            console.log("Respuesta que falló al parsear:", texto);
            alert("La respuesta del servidor no es válida.");
          }
        })
        .catch(err => {
          console.error("Error inesperado al actualizar operador:", err);
        });

        document.body.removeChild(modal);
      };

      btnEliminar.onclick = () => {
        if (!confirm("¿Estás seguro de eliminar este operador?")) return;

        fetch("./api/tareas/update_operador.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accion: "eliminar", id })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("Operador eliminado");
            mostrarSeccion("asignacion");
          } else {
            alert("Error: " + data.error);
          }
        });
        document.body.removeChild(modal);
      };
    }
  // --- Modal para agregar/editar/eliminar material de inventario ---
  function mostrarFormularioInventario(accion) {
    const modal = document.createElement("div");
    modal.className = "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50";

    const modalContent = document.createElement("div");
    modalContent.className = "bg-white p-6 rounded shadow-md w-96";

    const title = document.createElement("h2");
    title.className = "text-lg font-semibold mb-4";
    title.textContent = (accion === "agregar" ? "Agregar Material" :
                        accion === "editar" ? "Editar Material" :
                        "Eliminar Material");

    const idInput = document.createElement("input");
    idInput.placeholder = "ID (solo para editar/eliminar)";
    idInput.className = "w-full border p-2 mb-2 text-sm rounded";
    if (accion === "agregar") idInput.style.display = "none";

    const nombreInput = document.createElement("input");
    nombreInput.placeholder = "Nombre del Material";
    nombreInput.className = "w-full border p-2 mb-2 text-sm rounded";
    if (accion === "eliminar") nombreInput.style.display = "none";

    const cantidadInput = document.createElement("input");
    cantidadInput.placeholder = "Cantidad Disponible";
    cantidadInput.type = "number";
    cantidadInput.className = "w-full border p-2 mb-2 text-sm rounded";
    if (accion === "eliminar") cantidadInput.style.display = "none";

    const cantidadMinInput = document.createElement("input");
    cantidadMinInput.placeholder = "Cantidad Mínima";
    cantidadMinInput.type = "number";
    cantidadMinInput.className = "w-full border p-2 mb-2 text-sm rounded";
    if (accion === "eliminar") cantidadMinInput.style.display = "none";

    const estadoInput = document.createElement("input");
    estadoInput.placeholder = "Estado (Disponible / No disponible)";
    estadoInput.className = "w-full border p-2 mb-2 text-sm rounded";
    if (accion === "eliminar") estadoInput.style.display = "none";

    const btns = document.createElement("div");
    btns.className = "flex justify-end mt-4 space-x-2";

    const btnCancelar = document.createElement("button");
    btnCancelar.textContent = "Cancelar";
    btnCancelar.className = "bg-gray-300 px-3 py-1 rounded text-sm";
    btnCancelar.onclick = () => document.body.removeChild(modal);

    const btnGuardar = document.createElement("button");
    btnGuardar.textContent = "Guardar";
    btnGuardar.className = "bg-teal-600 text-white px-3 py-1 rounded text-sm";
    btnGuardar.onclick = () => {
      let payload = {};
      if (accion === "agregar") {
        if (!nombreInput.value.trim() || !cantidadInput.value.trim() || !cantidadMinInput.value.trim() || !estadoInput.value.trim()) {
          alert("Por favor completa todos los campos para agregar material.");
          return;
        }
        payload = {
          accion: "agregar",
          Material: nombreInput.value,
          cantidad_disp: cantidadInput.value,
          cantidad_min: cantidadMinInput.value,
          estado: estadoInput.value
        };
      } else if (accion === "editar") {
        if (!idInput.value.trim() || !nombreInput.value.trim() || !cantidadInput.value.trim() || !cantidadMinInput.value.trim() || !estadoInput.value.trim()) {
          alert("Por favor completa todos los campos para editar material.");
          return;
        }
        payload = {
          accion: "editar",
          id: idInput.value,
          Material: nombreInput.value,
          cantidad_disp: cantidadInput.value,
          cantidad_min: cantidadMinInput.value,
          estado: estadoInput.value
        };
      } else if (accion === "eliminar") {
        if (!idInput.value.trim()) {
          alert("Por favor indica el ID para eliminar material.");
          return;
        }
        payload = {
          accion: "eliminar",
          id: idInput.value
        };
      }

      fetch("api/inventario/update_material.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert(data.success ? "Operación realizada correctamente" : "Error: " + data.error);
        if (data.success) {
          mostrarSeccion("logistica");
        }
      })
      .catch(err => {
        console.error("Error al actualizar inventario:", err);
        alert("Ocurrió un error al procesar la solicitud.");
      });

      document.body.removeChild(modal);
    };

    btns.appendChild(btnCancelar);
    btns.appendChild(btnGuardar);

    modalContent.appendChild(title);
    if (accion !== "agregar") modalContent.appendChild(idInput);
    modalContent.appendChild(nombreInput);
    modalContent.appendChild(cantidadInput);
    modalContent.appendChild(cantidadMinInput);
    modalContent.appendChild(estadoInput);
    modalContent.appendChild(btns);
    modal.appendChild(modalContent);
    document.body.appendChild(modal);
  }
