    function mostrarSeccion(nombre) {
      content.innerHTML = secciones[nombre];

      // Colorear el botón activo
      for (const key in botones) {
        botones[key].classList.remove("text-teal-600", "font-semibold");
        botones[key].classList.add("text-gray-500");
      }
      botones[nombre].classList.remove("text-gray-500");
      botones[nombre].classList.add("text-teal-600", "font-semibold");
      function inicializarGraficas() {
  if (document.getElementById("graficaPedidos")) {
    new Chart(document.getElementById("graficaPedidos"), {
      type: 'doughnut',
      data: {
        labels: ["En proceso", "Completado", "Pendiente"],
        datasets: [{
          label: "Pedidos",
          data: [14, 5, 5],
          backgroundColor: ["#0d9488", "#b45309", "#a855f7"],
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: "bottom"
          }
        }
      }
    });
  }

  if (document.getElementById("graficaDisponibilidad")) {
    new Chart(document.getElementById("graficaDisponibilidad"), {
      type: 'bar',
      data: {
        labels: ["Tela de algodón", "Hilo negro", "Botones", "Cremalleras", "Forro de tela"],
        datasets: [{
          label: "Cantidad disponible",
          data: [500, 0, 1000, 300, 600],
          backgroundColor: "#0d9488"
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  }
}

// Llamar cuando se muestra la sección resumen
const originalMostrarSeccion = mostrarSeccion;
mostrarSeccion = function(nombre) {
  originalMostrarSeccion(nombre);
    if (nombre === "asignacion") {
      fetch("api/tareas/get_operadores.php")
        .then(res => res.json())
      .then(data => {
        if (Array.isArray(data)) {
          if (jerarquia === "2") {
            const miTarea = data.find(op => op.nombre === nombreUsuario);
            if (miTarea) {
              const contenedor = document.getElementById("contenedor-disponibles");
              if (contenedor) {
                contenedor.innerHTML = `
    <div class="p-6 bg-white border-2 border-teal-600 rounded-lg shadow-lg col-span-2">
      <h2 class="text-3xl font-bold text-teal-700 mb-4">Tarea Asignada</h2>
      <h3 class="text-xl font-semibold text-gray-800">${miTarea.tarea_asignada}</h3>
      <p class="text-lg mt-3 text-gray-700">${miTarea.descripcion}</p>
    </div>
  `;
              }
            }
          }
          const asignacionDiv = document.getElementById("contenedor-operadores");
          if (asignacionDiv) {
            asignacionDiv.innerHTML = ""; // limpiar contenido anterior
            data.forEach(op => {
              const div = document.createElement("div");
              div.className = "p-3 bg-gray-100 rounded";
              div.innerHTML = `
  <div class="flex justify-between items-center">
    <div>
      <span class="text-teal-600 font-bold text-sm">${op.especialidad}</span><br>
      ${op.nombre} - ${op.tarea_asignada}
    </div>
    <div>
      <button 
        onclick="asignarTarea(${op.id}, '${op.nombre}')"
        class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-3 py-1 rounded"
      >
        Editar tarea
      </button>
      ${jerarquia !== "2" ? `
        <button 
          onclick="gestionarOperador(${op.id}, '${op.nombre}', '${op.especialidad}')"
          class="bg-yellow-500 hover:bg-yellow-600 text-white text-xs px-3 py-1 rounded ml-2"
        >
          Opciones
        </button>
      ` : ""}
    </div>
  </div>
`;
              asignacionDiv.appendChild(div);
            });
          }
          const disponiblesDiv = document.getElementById("contenedor-disponibles");
          if (disponiblesDiv) {
            disponiblesDiv.innerHTML = "";
            data.forEach(op => {
              const div = document.createElement("div");
              div.innerHTML = `<span class="text-teal-600 font-bold">${op.especialidad.toUpperCase()}</span><br>${op.nombre}`;
              disponiblesDiv.appendChild(div);
            });
          }
        }
      })
      .catch(err => console.error("Error cargando operadores:", err));
  }
  if (nombre === "resumen") {
    setTimeout(inicializarGraficas, 100); // dar tiempo a que se renderice el DOM
  }
  if (nombre !== "logistica") {
    const logisticaDiv = document.getElementById("logistica-screen");
    if (logisticaDiv) {
      logisticaDiv.style.display = "none";
    }
  }
};
    }

    // Mostrar por defecto
    // Mostrar u ocultar botones del menú según jerarquía
    if (jerarquia === "2") {
      // Ocultar secciones exclusivas del administrador
      const btnResumen = document.getElementById("btn-resumen");
      const btnLogistica = document.getElementById("btn-logistica");
      if (btnResumen) btnResumen.style.display = "none";
      if (btnLogistica) btnLogistica.style.display = "none";
    }
    // Mostrar sección inicial según jerarquía
    mostrarSeccion(jerarquia === "2" ? "asignacion" : "resumen");
    
    function asignarTarea(id, nombre) {
  fetch("api/tareas/get_tareas.php")
    .then(res => res.json())
    .then(tareas => {
      const select = document.createElement("select");
      select.className = "border p-2 rounded w-full mt-2";
      tareas.forEach(t => {
        const option = document.createElement("option");
        option.value = t;
        option.textContent = t;
        select.appendChild(option);
      });
  
      const modal = document.createElement("div");
      modal.className = "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50";
      
      const modalContent = document.createElement("div");
      modalContent.className = "bg-white p-6 rounded shadow-md w-80";
      
      const heading = document.createElement("h2");
      heading.className = "text-lg font-semibold mb-2";
      heading.textContent = `Asignar nueva tarea a ${nombre}`;
      
      const btns = document.createElement("div");
      btns.className = "mt-4 flex justify-end space-x-2";
      
      const btnCancelar = document.createElement("button");
      btnCancelar.textContent = "Cancelar";
      btnCancelar.className = "bg-gray-300 hover:bg-gray-400 text-sm px-3 py-1 rounded";
      btnCancelar.id = "cancelar";
      
      const btnGuardar = document.createElement("button");
      btnGuardar.textContent = "Guardar";
      btnGuardar.className = "bg-teal-600 text-white hover:bg-teal-700 text-sm px-3 py-1 rounded";
      btnGuardar.id = "guardar";
      
      btns.appendChild(btnCancelar);
      btns.appendChild(btnGuardar);
      
      modalContent.appendChild(heading);
      modalContent.appendChild(select);
      modalContent.appendChild(btns);
      modal.appendChild(modalContent);
      document.body.appendChild(modal);
  
      document.getElementById("cancelar").onclick = () => document.body.removeChild(modal);
      document.getElementById("guardar").onclick = () => {
        const nuevaTarea = select.value;
        fetch(`api/tareas/update_tarea_operador.php?jerarquia=${jerarquia}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, tarea_asignada: nuevaTarea })
        })
        .then(res => res.json())
        .then(data => {
          console.log("Respuesta del servidor al actualizar tarea:", data);
          const notif = document.getElementById("notificacion");
          if (data.success) {
            notif.textContent = "Tarea actualizada correctamente";
            mostrarSeccion("asignacion");
          } else {
            notif.textContent = "Error al actualizar tarea";
          }
          notif.classList.remove("hidden");
          setTimeout(() => notif.classList.add("hidden"), 3000);
        })
        .catch(err => {
          console.error("Error al enviar actualización:", err);
          alert("No se pudo actualizar la tarea.");
        });
        document.body.removeChild(modal);
      };
    })
    .catch(err => {
      console.error("Error al cargar lista de tareas:", err);
      alert("No se pudo cargar la lista de tareas.");
    });
    }

    function gestionarOperador(id, nombre, especialidad) {
      const modal = document.createElement("div");
      modal.className = "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50";

      const modalContent = document.createElement("div");
      modalContent.className = "bg-white p-6 rounded shadow-md w-80";

      const title = document.createElement("h2");
      title.className = "text-lg font-semibold mb-2";
      title.textContent = `Gestionar operador: ${nombre}`;

      const nombreInput = document.createElement("input");
      nombreInput.value = nombre;
      nombreInput.placeholder = "Nombre";
      nombreInput.className = "w-full border p-2 mb-2 text-sm rounded";

      const especialidadInput = document.createElement("input");
      especialidadInput.value = especialidad;
      especialidadInput.placeholder = "Especialidad";
      especialidadInput.className = "w-full border p-2 mb-2 text-sm rounded";

      const btns = document.createElement("div");
      btns.className = "flex justify-between mt-4";

      const btnActualizar = document.createElement("button");
      btnActualizar.textContent = "Actualizar";
      btnActualizar.className = "bg-blue-500 text-white px-3 py-1 rounded text-sm";

      const btnEliminar = document.createElement("button");
      btnEliminar.textContent = "Eliminar";
      btnEliminar.className = "bg-red-500 text-white px-3 py-1 rounded text-sm";

      const btnCancelar = document.createElement("button");
      btnCancelar.textContent = "Cancelar";
      btnCancelar.className = "bg-gray-300 px-3 py-1 rounded text-sm";

      btns.appendChild(btnActualizar);
      btns.appendChild(btnEliminar);
      btns.appendChild(btnCancelar);

      modalContent.appendChild(title);
      modalContent.appendChild(nombreInput);
      modalContent.appendChild(especialidadInput);
      modalContent.appendChild(btns);
      modal.appendChild(modalContent);
      document.body.appendChild(modal);

      btnCancelar.onclick = () => document.body.removeChild(modal);

      btnActualizar.onclick = () => {
        const idValido = parseInt(id);
        if (!nombreInput.value.trim() || !especialidadInput.value.trim() || isNaN(idValido)) {
          alert("Datos inválidos.");
          return;
        }

        console.log("Enviando actualización:", {
          accion: "actualizar",
          id: idValido,
          nombre: nombreInput.value,
          especialidad: especialidadInput.value
        });

        fetch("api/tareas/update_operador.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            accion: "actualizar",
            id: idValido,
            nombre: nombreInput.value,
            especialidad: especialidadInput.value
          })
        })
        .then(async res => {
          const texto = await res.text();
          console.log("Respuesta cruda del servidor:", texto);
          try {
            const data = JSON.parse(texto);
            if (data.success) {
              alert("Operador actualizado");
              mostrarSeccion("asignacion");
            } else {
              alert("Error: " + data.error);
            }
          } catch (err) {
            console.error("Error al parsear JSON:", err);
            console.log("Respuesta que falló al parsear:", texto);
            alert("La respuesta del servidor no es válida.");
          }
        })
        .catch(err => {
          console.error("Error inesperado al actualizar operador:", err);
        });

        document.body.removeChild(modal);
      };

      btnEliminar.onclick = () => {
        if (!confirm("¿Estás seguro de eliminar este operador?")) return;

        fetch("./api/tareas/update_operador.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accion: "eliminar", id })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("Operador eliminado");
            mostrarSeccion("asignacion");
          } else {
            alert("Error: " + data.error);
          }
        });
        document.body.removeChild(modal);
      };
    }
  </script>
  

</body>
