<!DOCTYPE html>

<html lang="es">
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Logistica del taller</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    th {
      background-color: #f2f2f2;
      text-align: left;
    }
  </style>
</head>
<body class="bg-white text-gray-800" style="background: #e0e5ec; color: #333">
<!-- Contenido principal -->
<div class="pb-24 px-4 pt-6" id="content"></div>
<!-- Menú inferior -->
<div class="fixed bottom-0 w-full bg-white flex justify-around items-center py-3 border-t shadow-md" style="box-shadow:8px 8px 15px #d1d9e6, -8px -8px 15px #ffffff; border-radius:12px; background:#e0e5ec; border:none">
<div class="relative group flex flex-col items-center text-gray-500 hover:text-teal-600" id="btn-usuario">
<button class="focus:outline-none mt-1" style="box-shadow:8px 8px 15px #d1d9e6, -8px -8px 15px #ffffff; border-radius:12px; background:#e0e5ec; border:none">
<svg class="h-8 w-8 text-gray-600" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M5.121 17.804A9.004 9.004 0 0112 15c2.003 0 3.864.66 5.304 1.768M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<div class="absolute bottom-12 left-1/2 transform -translate-x-1/2 bg-white border rounded shadow-md w-32 opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-50" style="box-shadow:8px 8px 15px #d1d9e6, -8px -8px 15px #ffffff; border-radius:12px; background:#e0e5ec; border:none">
<div class="px-4 py-2 border-b text-sm text-gray-600" id="perfil-info" style="display: none;">
<div><strong>Persona:</strong> <span id="info-usuario">-</span></div>
<div><strong>Jerarquía:</strong> <span id="info-jerarquia">-</span></div>
</div>
<button class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-100" id="btn-ver-perfil" style="box-shadow:8px 8px 15px #d1d9e6, -8px -8px 15px #ffffff; border-radius:12px; background:#e0e5ec; border:none">View Profile</button>
<button class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-100" onclick="window.location.href='index.html'" style="box-shadow:8px 8px 15px #d1d9e6, -8px -8px 15px #ffffff; border-radius:12px; background:#e0e5ec; border:none">Sign Out</button>
</div>
</div>
<button class="flex flex-col items-center text-gray-500 hover:text-teal-600" id="btn-resumen" onclick="mostrarSeccion('resumen')" style="box-shadow:8px 8px 15px #d1d9e6, -8px -8px 15px #ffffff; border-radius:12px; background:#e0e5ec; border:none">
<svg class="h-6 w-6 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 3v18h18V3H3zm4 14h2v-2H7v2zm0-4h2v-2H7v2zm0-4h2V7H7v2zm4 8h2v-2h-2v2zm0-4h2v-2h-2v2zm0-4h2V7h-2v2zm4 8h2v-2h-2v2zm0-4h2v-2h-2v2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<button class="flex flex-col items-center text-gray-500 hover:text-teal-600" id="btn-asignacion" onclick="mostrarSeccion('asignacion')" style="box-shadow:8px 8px 15px #d1d9e6, -8px -8px 15px #ffffff; border-radius:12px; background:#e0e5ec; border:none">
<svg class="h-6 w-6 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<button class="flex flex-col items-center text-gray-500 hover:text-teal-600" id="btn-logistica" onclick="mostrarSeccion('logistica')" style="box-shadow:8px 8px 15px #d1d9e6, -8px -8px 15px #ffffff; border-radius:12px; background:#e0e5ec; border:none">
<svg class="h-6 w-6 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 8c1.657 0 3-1.343 3-3S13.657 2 12 2s-3 1.343-3 3 1.343 3 3 3zM6.343 16.657A8 8 0 1117.657 5.343 8 8 0 016.343 16.657z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<button class="flex flex-col items-center text-gray-500 hover:text-teal-600" id="btn-fichas" onclick="mostrarSeccion('fichas')" style="box-shadow:8px 8px 15px #d1d9e6, -8px -8px 15px #ffffff; border-radius:12px; background:#e0e5ec; border:none">
<svg class="h-6 w-6 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5h6M9 9h6m-6 4h6m-6 4h6M5 5h.01M5 9h.01M5 13h.01M5 17h.01" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>

<button class="flex flex-col items-center text-gray-500 hover:text-teal-600 neumorphism-button" id="btn-pedidos" onclick="mostrarSeccion('pedidos')">
<svg class="h-6 w-6 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<div class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-4 py-2 rounded shadow-lg text-sm hidden z-50" id="notificacion" style="box-shadow:8px 8px 15px #d1d9e6, -8px -8px 15px #ffffff; border-radius:12px; background:#e0e5ec; border:none">
    Actualización exitosa
  </div>
<script>
    // Obtener los datos del usuario desde localStorage
    const jerarquia = localStorage.getItem("jerarquiaUsuario");
    const nombreUsuario = localStorage.getItem("nombreUsuario");

    // Redirigir al login si no hay sesión activa
    if (!jerarquia) {
      window.location.href = "index.html";
    } else {
      console.log("Usuario autenticado:", nombreUsuario, "| Jerarquía:", jerarquia);
      const usuarioSpan = document.getElementById("info-usuario");
      const jerarquiaSpan = document.getElementById("info-jerarquia");
      if (usuarioSpan) usuarioSpan.textContent = nombreUsuario;
      if (jerarquiaSpan) jerarquiaSpan.textContent = jerarquia === "1" ? "Administrador" : "Obrero";
    }

    document.getElementById("btn-ver-perfil").addEventListener("click", () => {
      const perfilDiv = document.getElementById("perfil-info");
      if (perfilDiv.style.display === "none") {
        perfilDiv.style.display = "block";
      } else {
        perfilDiv.style.display = "none";
      }
    });
  </script>
<!-- Script -->
<script>
    const content = document.getElementById("content");
    const botones = {
      resumen: document.getElementById("btn-resumen"),
      asignacion: document.getElementById("btn-asignacion"),
      logistica: document.getElementById("btn-logistica"),
      fichas: document.getElementById("btn-fichas")
    };

    const secciones = {
      pedidos: `
        <div class="neumorphism-card p-6">
          <h2 class="text-2xl font-bold mb-4">Registrar nuevo pedido</h2>
          <form id='formPedido' class='space-y-4'>
            <input type='text' id='producto' placeholder='Producto (Ej. Pantalón Cargo)' class='w-full p-3 rounded neumorphism-input' required>
            <input type='number' id='cantidad' placeholder='Cantidad' min='1' class='w-full p-3 rounded neumorphism-input' required>
            <button type='submit' class='bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600'>Registrar Pedido</button>
          </form>
          <h2 class='text-xl font-semibold mt-8 mb-4'>Pedidos registrados</h2>
          <div id='listaPedidos' class='space-y-2'>Cargando pedidos...</div>
        </div>
      `,
    
      fichas: `
<h2 class="text-2xl font-bold mb-4 text-center">Fichas Técnicas de Pantalones</h2>
<div id="fichas-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
`,
      resumen: `
  <h2 class="text-2xl font-bold mb-4">Pedidos</h2>
  <div class="mb-8 flex justify-center">
  <canvas id="graficaPedidos" style="max-width: 400px; max-height: 400px;"></canvas>
</div>

  <h2 class="text-2xl font-bold mb-4">Disponibilidad</h2>
  <canvas id="graficaDisponibilidad" class="mb-8"></canvas>
`,

      asignacion: `
  <h2 class="text-2xl font-bold mb-4">Operadores Disponibles</h2>
  <div id="contenedor-disponibles" class="grid grid-cols-2 gap-4 text-sm mb-8"></div>
  <h2 class="text-2xl font-bold mb-4">Gestión de Operadores</h2>
  <div id="contenedor-operadores" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm"></div>
`,
      logistica: `
    <h3 class="text-lg font-semibold mb-2 mt-8">Inventario</h3>
    <div class="flex justify-between items-center mb-2">
      <input type="search" class="border p-2 rounded text-sm" placeholder="Search" />
    </div>

    <table class="w-full text-sm border">
      <thead class="bg-gray-100 text-left">
        <tr>
          <th class="p-2 border">ID</th>
          <th class="p-2 border">MATERIAL</th>
          <th class="p-2 border">CANTIDAD_DISPONIBLE</th>
          <th class="p-2 border">CANTIDAD_MINIMA</th>
          <th class="p-2 border">ESTADO</th>
        </tr>
      </thead>
      <tbody id="tablaInventarioBody">
        <!-- Contenido generado dinámicamente desde get_inventario.php -->
      </tbody>
    </table>
    <div class="mt-4 flex flex-wrap gap-3">
      <button onclick="mostrarFormularioInventario('agregar')" class="bg-green-600 text-white px-4 py-2 rounded text-sm">Agregar Material</button>
      <button onclick="mostrarFormularioInventario('editar')" class="bg-yellow-500 text-white px-4 py-2 rounded text-sm">Editar Material</button>
      <button onclick="mostrarFormularioInventario('eliminar')" class="bg-red-600 text-white px-4 py-2 rounded text-sm">Eliminar Material</button>
      <button onclick="generarReportePDF()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm">Generar Reporte PDF</button>
    </div>

    <h3 class="text-lg font-semibold mb-4 mt-8">Producción - Iniciar Corte de Tela</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium">Ficha Técnica</label>
        <select id="selectFicha" class="w-full border rounded p-2 text-sm">
          <option value="">Seleccione una ficha técnica</option>
          <!-- Opciones se llenarán dinámicamente -->
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium">Cantidad de Piezas</label>
        <input type="number" id="cantidadPiezas" class="w-full border rounded p-2 text-sm" placeholder="Ej: 100">
      </div>
      <div>
        <label class="block text-sm font-medium">Tamaño</label>
        <select id="selectTamaño" class="w-full border rounded p-2 text-sm">
          <option value="">Seleccione un tamaño</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium">Administrador de Línea</label>
        <select id="selectAdminLinea" class="w-full border rounded p-2 text-sm">
          <option value="">Seleccione un administrador</option>
          <!-- Opciones se llenarán dinámicamente -->
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium">Fecha de Inicio</label>
        <input type="date" id="fechaInicio" class="w-full border rounded p-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium">Fecha Estimada de Finalización</label>
        <input type="date" id="fechaFin" class="w-full border rounded p-2 text-sm">
      </div>
    </div>
    <div class="mt-4">
      <button onclick="iniciarCorteTela()" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm">Iniciar Corte de Tela</button>
    </div>
    <div id="alertaFichaMateriales" class="mt-2 text-red-600 text-sm hidden">
      <strong>¡Aviso!</strong> No se encuentra la relación de materiales para esta ficha técnica. Contacte a su administrador.
    </div>

    <h3 class="text-lg font-semibold mb-4 mt-8">Cortes Actuales</h3>
    <table id="tablaCortesActuales" class="w-full text-sm border">
      <thead class="bg-gray-100 text-left">
        <tr>
          <th class="p-2 border">ID</th>
          <th class="p-2 border">Ficha Técnica</th>
          <th class="p-2 border">Administrador</th>
          <th class="p-2 border">Fecha Inicio</th>
          <th class="p-2 border">Fecha Fin</th>
          <th class="p-2 border">Estado</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="6" class="text-center p-2 border">Cargando cortes actuales...</td>
        </tr>
      </tbody>
    </table>
  `
};

    // Variable global para la instancia de la gráfica de pedidos
    let graficaPedidosInstance = null;

    function inicializarGraficas() {
        const canvasPedidos = document.getElementById("graficaPedidos");
        if (canvasPedidos) {
            const ctxPedidos = canvasPedidos.getContext('2d');
            if (graficaPedidosInstance) {
                graficaPedidosInstance.destroy();
            }
            graficaPedidosInstance = new Chart(ctxPedidos, {
                type: 'doughnut',
                data: {
                    labels: ["En proceso", "Completado", "Pendiente"],
                    datasets: [{
                        label: "Pedidos",
                        data: [14, 5, 5],
                        backgroundColor: ["#0d9488", "#b45309", "#a855f7"],
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: "bottom"
                        }
                    }
                }
            });
        }
    }

    function mostrarSeccion(nombre) {
      content.innerHTML = secciones[nombre];

      // Colorear el botón activo
      for (const key in botones) {
        botones[key].classList.remove("text-teal-600", "font-semibold");
        botones[key].classList.add("text-gray-500");
      }
      botones[nombre].classList.remove("text-gray-500");
      botones[nombre].classList.add("text-teal-600", "font-semibold");

      // FICHAS DINÁMICAS
      if (nombre === "fichas") {
        // Mensaje de consola para depuración
        console.log("Cargando fichas técnicas...");
        // Insertar botón + Nueva Ficha antes del contenedor de las fichas
        const fichasHeader = document.querySelector("#content h2.text-2xl");
        if (fichasHeader) {
          const btnDiv = document.createElement("div");
          btnDiv.className = "flex justify-end mb-4";
          btnDiv.innerHTML = `<button onclick="mostrarFormularioFicha()" class="bg-teal-600 text-white px-4 py-2 rounded text-sm">+ Nueva Ficha</button>`;
          fichasHeader.insertAdjacentElement("afterend", btnDiv);
        }
        // Cargar fichas técnicas desde la base de datos vía API
        fetch("api/fichas/get_fichas.php")
          .then(res => res.json())
          .then(data => {
            console.log("Datos recibidos para fichas:", data);  // Línea añadida
            const container = document.getElementById("fichas-container");
            if (Array.isArray(data)) {
              container.innerHTML = "";
              data.forEach(ficha => {
                console.log("Ficha individual:", ficha);
                const card = document.createElement("div");
                card.className = "bg-white shadow rounded overflow-hidden";
              card.innerHTML = `
                  <img src="img/${ficha.sku ? ficha.sku : 'placeholder'}.jpg" alt="${ficha.nombre}" class="w-full h-48 object-cover">
                  <div class="p-4">
                    <h3 class="text-lg font-semibold">${ficha.nombre}</h3>
                    <p class="text-sm text-gray-600 mt-2">${ficha.descripcion}</p>
                    <div class="mt-2 text-sm text-gray-700">
                      <p><strong>Botones:</strong> ${ficha.boton}</p>
                      <p><strong>Cierres:</strong> ${ficha.cierre}</p>
                      <p><strong>Hilos:</strong> ${ficha.hilo}</p>
                    </div>
                    <div class="flex justify-end gap-2 mt-4">
                      <button onclick="editarFicha(${ficha.idfic})" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-xs">Editar</button>
                      <button onclick="eliminarFicha(${ficha.idfic})" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs">Eliminar</button>
                    </div>
                  </div>
                `;
                container.appendChild(card);
              });
            } else {
              // Si la respuesta no es un array, mostrar error claro
              container.innerHTML = `<p class="text-center text-red-500">Error: Respuesta inesperada al cargar fichas técnicas.</p>`;
              console.error("La respuesta de get_fichas.php no es un array:", data);
            }
          })
          .catch(err => {
            console.error("Error cargando fichas:", err);
            const container = document.getElementById("fichas-container");
            container.innerHTML = `<p class="text-center text-red-500">Error loading fichas.</p>`;
          });
      }

// Llamar cuando se muestra la sección resumen
const originalMostrarSeccion = mostrarSeccion;
mostrarSeccion = function(nombre) {
  originalMostrarSeccion(nombre);
    if (nombre === "asignacion") {
      fetch("api/tareas/get_operadores.php")
        .then(res => res.json())
      .then(data => {
        if (Array.isArray(data)) {

          const asignacionDiv = document.getElementById("contenedor-operadores");
          if (asignacionDiv) {
            asignacionDiv.innerHTML = ""; // limpiar contenido anterior
            data.forEach(op => {
              const div = document.createElement("div");
              div.className = "p-3 bg-gray-100 rounded";
              div.innerHTML = `
  <div class="flex justify-between items-center">
    <div>
      <span class="text-teal-600 font-bold text-sm">${op.especialidad}</span><br>
      ${op.nombre} - ${op.tarea_asignada}
    </div>
    <div>
      <button 
        onclick="asignarTarea(${op.id}, '${op.nombre}')"
        class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-3 py-1 rounded"
      >
        Editar tarea
      </button>
      ${jerarquia !== "2" ? `
        <button 
          onclick="gestionarOperador(${op.id}, '${op.nombre}', '${op.especialidad}')"
          class="bg-yellow-500 hover:bg-yellow-600 text-white text-xs px-3 py-1 rounded ml-2"
        >
          Opciones
        </button>
      ` : ""}
    </div>
  </div>
`;
              asignacionDiv.appendChild(div);
            });
          }
          const disponiblesDiv = document.getElementById("contenedor-disponibles");
          if (disponiblesDiv) {
            disponiblesDiv.innerHTML = "";
            data.forEach(op => {
              const div = document.createElement("div");
              div.innerHTML = `<span class="text-teal-600 font-bold">${op.especialidad.toUpperCase()}</span><br>${op.nombre}`;
              disponiblesDiv.appendChild(div);
            });
          }
        }
      })
      .catch(err => console.error("Error cargando operadores:", err));
  }
  if (nombre === "resumen") {
    setTimeout(inicializarGraficas, 100); // dar tiempo a que se renderice el DOM

    // Cargar datos de inventario y actualizar la gráfica de disponibilidad
    fetch("api/inventario/get_inventario.php")
        .then(res => res.json())
        .then(data => {
            let inventarioArray = [];
            if (Array.isArray(data)) {
                inventarioArray = data;
            } else if (data.success && Array.isArray(data.data)) {
                inventarioArray = data.data;
            }
            const nombres = inventarioArray.map(item => item.Material);
            const cantidades = inventarioArray.map(item => parseInt(item.cantidad_disp, 10));

            const canvasDisponibilidad = document.getElementById("graficaDisponibilidad");
            if (canvasDisponibilidad) {
                const ctx = canvasDisponibilidad.getContext('2d');
                if (window.graficaDisponibilidadInstance) {
                    window.graficaDisponibilidadInstance.destroy();
                }
                window.graficaDisponibilidadInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: nombres,
                        datasets: [{
                            label: 'Cantidad disponible',
                            data: cantidades,
                            backgroundColor: '#0d9488'
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }
        })
        .catch(err => {
            console.error("Error cargando la gráfica de disponibilidad:", err);
        });
  }

  // --- Cargar inventario dinámicamente al mostrar logística ---
    
  if (nombre === "pedidos") {
    fetch("api/pedidos/listar_pedidos.php")
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById("tablaPedidosBody");
        if (!tbody) return;

        if (Array.isArray(data)) {
          tbody.innerHTML = "";
          data.forEach(pedido => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td class="p-2 border">${pedido.idpedi}</td>
              <td class="p-2 border">${pedido.nombrecliente}</td>
              <td class="p-2 border">${pedido.pro_nombre}</td>
              <td class="p-2 border">${pedido.cantidad}</td>
              <td class="p-2 border">${pedido.fecha_registro}</td>
              <td class="p-2 border">${pedido.fecha_entrega}</td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="6" class="p-2 border text-center text-red-500">Error cargando pedidos.</td></tr>`;
        }
      })
      .catch(err => {
        console.error("Error al cargar pedidos:", err);
      });
  }

  if (nombre === "logistica") {
    fetch("api/inventario/get_inventario.php")
      .then(res => {
        if (!res.ok) {
          throw new Error("Error al conectar con la API de inventario");
        }
        return res.json();
      })
      .then(data => {
        console.log("Datos de inventario recibidos:", data);

          alert("Datos inválidos.");
          return;

        console.log("Enviando actualización:", {
          accion: "actualizar",
          id: idValido,
          nombre: nombreInput.value,
          especialidad: especialidadInput.value
        });

        fetch("api/tareas/update_operador.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            accion: "actualizar",
            id: idValido,
            nombre: nombreInput.value,
            especialidad: especialidadInput.value
          })
        })
        .then(async res => {
          const texto = await res.text();
          console.log("Respuesta cruda del servidor:", texto);
          try {
            const data = JSON.parse(texto);
            if (data.success) {
              alert("Operador actualizado");
              mostrarSeccion("asignacion");
            } else {
              alert("Error: " + data.error);
            }
          } catch (err) {
            console.error("Error al parsear JSON:", err);
            console.log("Respuesta que falló al parsear:", texto);
            alert("La respuesta del servidor no es válida.");
          }
        })
        .catch(err => {
          console.error("Error inesperado al actualizar operador:", err);
        });

        document.body.removeChild(modal);
      };

      btnEliminar.onclick = () => {
        if (!confirm("¿Estás seguro de eliminar este operador?")) return;

        fetch("./api/tareas/update_operador.php", {

          headers: { "Content-Type": "application/json" },

        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("Operador eliminado");
            mostrarSeccion("asignacion");
          } else {
            alert("Error: " + data.error);
          }
        });
        document.body.removeChild(modal);
      };
    }

    // --- Nueva lógica de cámara y selección de archivo ---
    let currentStream = null;

    function iniciarCamaraYMostrar() {
      const video = modalContent.querySelector("#camara");
      const btnTomarFoto = modalContent.querySelector("#btnTomarFoto");

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
          currentStream = stream;
          video.srcObject = stream;
          video.classList.remove("hidden");
          btnTomarFoto.classList.remove("hidden");
          video.style.height = "";  // Reset height when camera starts again
        })
        .catch(err => {
          console.error("No se pudo acceder a la cámara:", err);
          alert("No se pudo acceder a la cámara.");
        });
    }

    // Botón para activar la cámara y mostrar el video y botón de captura
    modalContent.querySelector("#btnHabilitarCamara").addEventListener("click", (e) => {
      e.preventDefault();
      iniciarCamaraYMostrar();
    });

    // Botón para capturar la foto (shutter)
    modalContent.querySelector("#btnTomarFoto").addEventListener("click", () => {
      const canvas = document.getElementById("fotoCanvas");
      const video = document.getElementById("camara");
      const vistaPrevia = document.getElementById("vistaPrevia");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      vistaPrevia.src = canvas.toDataURL('image/jpeg');
      vistaPrevia.classList.remove("hidden");

      // Stop the camera after capturing
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
      video.srcObject = null;  // Release the stream
      video.classList.add("hidden");
      video.style.height = "0px";  // Fully collapse the video space
      modalContent.querySelector("#btnTomarFoto").classList.add("hidden");

      alert("Foto tomada y lista para guardar.");
    });

    // Botón para abrir el selector de archivos manual
    modalContent.querySelector("#btnSeleccionarArchivo").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("fotoArchivo").click();
    });

    // Mostrar la vista previa al seleccionar un archivo
    modalContent.querySelector("#fotoArchivo").addEventListener("change", (e) => {
      const archivo = e.target.files[0];
      if (archivo && archivo.type.startsWith("image/")) {
        const vistaPrevia = document.getElementById("vistaPrevia");
        const reader = new FileReader();
        reader.onload = (ev) => {
          vistaPrevia.src = ev.target.result;
          vistaPrevia.classList.remove("hidden");
        };
        reader.readAsDataURL(archivo);
      }
    });
  }

    const descripcion = document.getElementById("descripcionFicha").value;
    const boton = document.getElementById("botonFicha").value;
    const cierre = document.getElementById("cierreFicha").value;
    const hilo = document.getElementById("hiloFicha").value;

    const canvas = document.getElementById("fotoCanvas");
    const video = document.getElementById("camara");
    const vistaPrevia = document.getElementById("vistaPrevia");
    const archivoInput = document.getElementById("fotoArchivo");

    if (!nombre || !descripcion || !boton || !cierre || !hilo) {
      alert("Por favor complete todos los campos.");
      return;
    }

    // Validar que la foto fue tomada (vista previa visible)
    if (vistaPrevia.classList.contains("hidden")) {
      alert("Por favor tome una foto antes de guardar.");
      return;
    }

    const formData = new FormData();
    formData.append('nombre', nombre);
    formData.append('descripcion', descripcion);
    formData.append('boton', boton);
    formData.append('cierre', cierre);
    formData.append('hilo', hilo);

    function enviarFicha(formData) {
      fetch('api/fichas/crear_ficha.php', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        console.log(data);
        alert(data.success ? "Ficha creada con éxito." : "Error: " + data.error);
        if (data.success) {
          mostrarSeccion("fichas");
          // Close the modal after success
          const modal = document.querySelector(".fixed");
          if (modal) document.body.removeChild(modal);
        }
      })
      .catch(err => {
        console.error("Error al guardar la ficha:", err);
        alert("Ocurrió un error al procesar la solicitud.");
      });
    }

    // Si el usuario seleccionó un archivo manualmente, usar ese archivo
    if (archivoInput.files.length > 0) {
      const archivo = archivoInput.files[0];
      if (!archivo.type.startsWith("image/")) {
        alert("Por favor seleccione un archivo de imagen válido.");
        return;
      }
      formData.append('foto', archivo);
      enviarFicha(formData);
    } else {
      // Tomar la imagen del canvas (foto tomada con la cámara)
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      canvas.toBlob(blob => {
        if (blob) {
          formData.append('foto', blob, 'ficha.jpg');
        }
        enviarFicha(formData);
      }, 'image/jpeg');
    }
  }

  // La función tomarFoto ya no se usa con el nuevo flujo de botón de captura manual
  // --- Generar reporte PDF del inventario ---
  async function generarReportePDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.text("Reporte de Inventario", 14, 20);

      // Seleccionar la tabla de inventario (segunda tabla)
      const tablas = document.querySelectorAll("table");
      if (tablas.length < 2) {
          alert("No se encontró la tabla de inventario.");
          return;
      }
      const tablaInventario = tablas[1];

      // Generar el PDF usando autoTable
      doc.autoTable({
          html: tablaInventario,
          startY: 30,
          theme: 'grid',
          headStyles: { fillColor: [13, 148, 136] },
      });

      doc.save('Reporte_Inventario.pdf');
  }
  // --- Función para iniciar corte de tela con integración backend ---
  function iniciarCorteTela() {
      const ficha = document.getElementById("selectFicha").value;
      const cantidad = document.getElementById("cantidadPiezas").value;
      const tamaño = document.getElementById("selectTamaño").value;
      const admin = document.getElementById("selectAdminLinea").value;
      const fechaInicio = document.getElementById("fechaInicio").value;
      const fechaFin = document.getElementById("fechaFin").value;

      if (!ficha || !cantidad || !tamaño || !admin || !fechaInicio || !fechaFin) {
          alert("Por favor complete todos los campos para iniciar el corte de tela.");
          return;
      }

      const datos = {
          ficha_id: ficha,
          cantidad_piezas: cantidad,
          tamaño: tamaño,
          admin_id: admin,
          fecha_inicio: fechaInicio,
          fecha_fin: fechaFin
      };

      // Ocultar alerta antes de enviar
      const alertaFicha = document.getElementById("alertaFichaMateriales");
      if (alertaFicha) alertaFicha.classList.add("hidden");

      fetch("api/produccion/iniciar_corte.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos)
      })
      .then(res => res.json())
      .then(data => {
          console.log("Respuesta del servidor:", data);
          const notif = document.getElementById("notificacion");
          if (data.success) {
              notif.textContent = "Corte de tela iniciado correctamente.";
              mostrarSeccion("logistica");  // Refrescar la tabla de cortes
          } else {
              // Si el error es que no existe ficha_materiales, mostrar alerta clara
              if (data.error && data.error.toLowerCase().includes("ficha_materiales")) {
                if (alertaFicha) {
                  alertaFicha.classList.remove("hidden");
                }
              }
              notif.textContent = data.error || "Error al iniciar el corte.";
          }
          notif.classList.remove("hidden");
          setTimeout(() => notif.classList.add("hidden"), 3000);
      })
      .catch(err => {
          console.error("Error al enviar datos al backend:", err);
          alert("Ocurrió un error al procesar la solicitud.");
      });
  }
  </script>

  function guardarCambiosFicha(id) {

    const boton = document.getElementById("botonFichaEditar").value;

    }

    formData.append('id', id);
    formData.append('nombre', nombre);
    formData.append('descripcion', descripcion);
    formData.append('boton', boton);
    formData.append('cierre', cierre);
    formData.append('hilo', hilo);

    if (archivoInput.files.length > 0) {

      }

    }

    fetch('api/fichas/editar_ficha.php', {

    })

  function eliminarFicha(id) {

    fetch("api/fichas/delete_ficha.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },

    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        alert("Ficha eliminada correctamente");
        mostrarSeccion("fichas");

    .catch(err => {

    document.addEventListener("DOMContentLoaded", () => {

      originalMostrarSeccion(nombre);

      <table id="tablaPedidos">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Registro</th>
            <th>Entrega</th>

        </thead>

          <tr><td colspan="5" class="text-center">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function cargarProductos() {
      try {
        const res = await fetch("api/productos/listar_productos.php");
        const productos = await res.json();
        const select = document.getElementById("producto");
        if (Array.isArray(productos)) {
          productos.forEach(p => {
            const option = document.createElement("option");
            option.value = p.id;
            option.textContent = p.nombre;
            select.appendChild(option);
          });
        }
      } catch (err) {
        console.error("Error al cargar productos:", err);
      }
    }

    async function cargarPedidos() {
      try {
        const res = await fetch("api/pedidos/listar_pedidos.php");
        const pedidos = await res.json();
        const tbody = document.getElementById("tablaPedidos").querySelector("tbody");
        tbody.innerHTML = "";
        if (Array.isArray(pedidos)) {
          pedidos.forEach(p => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${p.cliente}</td>
              <td>${p.producto}</td>
              <td>${p.cantidad}</td>
              <td>${p.fecha_registro}</td>
              <td>${p.fecha_entrega}</td>
            `;
            tbody.appendChild(row);
          });
        } else {
          tbody.innerHTML = "<tr><td colspan='5' class='text-center text-red-600'>Error al cargar pedidos</td></tr>";
        }
      } catch (err) {
        console.error("Error cargando pedidos:", err);
      }
    }

    document.getElementById("formPedido").addEventListener("submit", async (e) => {
      e.preventDefault();
      const datos = {
        cliente: document.getElementById("cliente").value,
        cantidad: document.getElementById("cantidad").value,
        fecha_registro: document.getElementById("fechaRegistro").value,
        fecha_entrega: document.getElementById("fechaEntrega").value,
        producto: document.getElementById("producto").value
      };
      try {
        const res = await fetch("api/pedidos/registrar_pedido.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos)
        });
        const result = await res.json();
        if (result.success) {
          alert("Pedido registrado exitosamente.");
          cargarPedidos();
          document.getElementById("formPedido").reset();
        } else {
          alert("Error: " + result.error);
        }
      } catch (err) {
        console.error("Error al registrar pedido:", err);
      }
    });

    cargarProductos();
    cargarPedidos();
  </script>
