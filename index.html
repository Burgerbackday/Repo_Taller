<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .login-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            color: #333;
        }

        .login-container p {
            margin-top: 10px;
            margin-bottom: 20px;
            color: #555;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .input-field:focus {
            border: 2px solid #2e8b57; /* tono verde oscuro */
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-primary {
            background-color: #178b9f; /* tono azul/verde */
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>  
   <script defer src="src/script.js?v=1.1"></script>
</head>

<body id="indexPage">
    <div class="login-container">
        <h2>Bienvenido</h2>
        <p>Por favor ingresa tu usuario</p>

        <!-- Formulario de inicio de sesión directo -->
        <form id="loginForm" onsubmit="return false;">
            <input type="text" id="username" class="input-field" placeholder="Usuario">
            <input type="password" id="password" class="input-field" placeholder="Contraseña">
            <button type="submit" class="btn btn-primary">Continuar</button>
        </form>

        <button class="btn btn-secondary" onclick="window.location.href='ayuda.html'">Pedir ayuda técnica</button>
        <button class="btn btn-secondary" onclick="window.location.href='test.html'">Test Login</button>
    </div>
    <script>
      const loginForm = document.getElementById("loginForm");

      loginForm.addEventListener("submit", async () => {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if (username && password) {
          try {
            const response = await fetch("api/usuarios/login.php", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (data.success) {
              // Guardamos los datos en localStorage
              localStorage.setItem("jerarquiaUsuario", data.jerarquia);
              localStorage.setItem("nombreUsuario", data.nombre);

              // Redirigimos al sistema principal
              window.location.href = "test.html";
            } else {
              alert("Credenciales incorrectas");
            }
          } catch (err) {
            console.error("Error al intentar autenticar:", err);
            alert("Error de conexión con el servidor.");
          }
        } else {
          alert("Por favor completa todos los campos.");
        }
      });
    </script>
</body>
</html>
